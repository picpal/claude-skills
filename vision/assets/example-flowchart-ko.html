<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이걸 스킬로 만들어야 할까?</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #0f766e;
      --font-sans:     'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-title:    'Pretendard', 'Noto Sans KR', sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-title);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · vision</p>
    <h1>이걸 스킬로 만들어야 할까?</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flowchart-ko-title flowchart-ko-desc">
      <title id="flowchart-ko-title">이걸 스킬로 만들어야 할까?</title>
      <desc id="flowchart-ko-desc">새 워크플로를 만나면 우선 수동으로 한 번 해보고, 세 번 넘게 반복될 일인지 판단한다. 반복되지 않으면 일회성으로 두고, 반복되면 여러 프로젝트에 재사용되는지에 따라 CLAUDE.md 메모나 스킬로 남긴다.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f766e"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <!-- Start → Step -->
        <line x1="500" y1="88" x2="500" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Step → Diamond 1 -->
        <line x1="500" y1="168" x2="500" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 1 "NO" right -->
        <line x1="600" y1="240" x2="720" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 1 "YES" down -->
        <line x1="500" y1="288" x2="500" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 2 "NO" right -->
        <line x1="600" y1="376" x2="720" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 2 "YES" down (accent — happy path) -->
        <line x1="500" y1="424" x2="500" y2="464" stroke="#0f766e" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Arrow labels -->
        <rect x="644" y="230" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="656" y="239" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="484" y="298" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="307" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <rect x="644" y="366" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="656" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <rect x="484" y="434" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="443" fill="#0f766e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>

        <!-- Start oval -->
        <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="500" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">새 워크플로</text>

        <!-- Rectangle: Step -->
        <rect x="420" y="120" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">우선 수동으로 한 번</text>

        <!-- Diamond 1: Repeated >3 times? -->
        <polygon points="500,192 600,240 500,288 400,240" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="238" fill="#2d3142" font-size="11" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">3회 넘게</text>
        <text x="500" y="252" fill="#2d3142" font-size="11" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">반복할 일인가?</text>

        <!-- End oval: One-off -->
        <rect x="720" y="216" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="800" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">일회성</text>
        <text x="800" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">keep manual</text>

        <!-- Diamond 2: Reusable across projects? -->
        <polygon points="500,328 600,376 500,424 400,376" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="374" fill="#2d3142" font-size="11" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">여러 프로젝트에</text>
        <text x="500" y="388" fill="#2d3142" font-size="11" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">재사용되나?</text>

        <!-- End oval: CLAUDE.md note -->
        <rect x="720" y="352" width="160" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="800" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">CLAUDE.md 메모</text>
        <text x="800" y="390" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">project-scoped</text>

        <!-- End oval: Write a skill (accent focal) -->
        <rect x="420" y="464" width="160" height="56" rx="28" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1"/>
        <text x="500" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">스킬로 작성</text>
        <text x="500" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reusable + assets</text>

        <!-- Legend -->
        <line x1="40" y1="540" x2="960" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="572" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="582" fill="#4f5d75" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">시작 · 종료 (타원)</text>

        <rect x="220" y="572" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="252" y="582" fill="#4f5d75" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">단계 (사각형)</text>

        <polygon points="412,578 424,572 436,578 424,584" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="448" y="582" fill="#4f5d75" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">분기 (마름모)</text>

        <line x1="604" y1="580" x2="632" y2="580" stroke="#0f766e" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="640" y="582" fill="#4f5d75" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">정상 경로</text>

        <line x1="768" y1="580" x2="796" y2="580" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="804" y="582" fill="#4f5d75" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">분기</text>
      </svg>
  </div>
</body>
</html>
