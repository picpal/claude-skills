<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘텐츠 사이트 · 아키텍처</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #0f766e;
      --font-sans:     'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-title:    'Pretendard', 'Noto Sans KR', sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-title);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · vision</p>
    <h1>운영 중인 콘텐츠 사이트</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-ko-title architecture-ko-desc">
      <title id="architecture-ko-title">운영 중인 콘텐츠 사이트</title>
      <desc id="architecture-ko-desc">브라우저 요청이 Cloudflare 엣지를 거쳐 Astro 오리진으로 SSR 되고, 오리진은 MDX 번들을 읽고 콘텐츠 CMS를 조회한다. 캐시된 HTML은 엣지에서 바로 반환된다.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f766e"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4c1d95"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Zone: Content services (drawn before arrows and nodes) -->
        <rect x="616" y="128" width="164" height="272" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="672" y="132" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="698" y="141" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">CONTENT</text>

        <!-- Arrows first (behind boxes) -->
        <line x1="168" y1="272" x2="220" y2="272" stroke="#4c1d95" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="364" y1="272" x2="416" y2="272" stroke="#0f766e" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- Exit Astro RIGHT edge (fanned 256/288, 32px apart) → enter MDX bottom / CMS top.
             Must not start on the box's own top/bottom edge: the horizontal would run along that border. -->
        <path d="M 576,256 H 692 Q 700,256 700,248 V 224"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 576,288 H 692 Q 700,288 700,296 V 320"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Dashed return: Cloudflare→Reader (cached HTML — same orthogonal rules as solid) -->
        <path d="M 220,288 H 168" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="172" y="252" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="196" y="262" fill="#4c1d95" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

        <rect x="172" y="278" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="188" y="287" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESP</text>

        <rect x="368" y="252" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="392" y="262" fill="#0f766e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SSR</text>

        <rect x="632" y="236" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="662" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ MDX</text>

        <rect x="632" y="268" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="654" y="277" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUERY</text>

        <!-- Node: Reader -->
        <rect x="40" y="240" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="240" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="48" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="62" y="257" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="104" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">사용자</text>
        <text x="104" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Browser</text>

        <!-- Node: Cloudflare -->
        <rect x="220" y="240" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="220" y="240" width="144" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="228" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="244" y="257" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
        <text x="356" y="300" fill="rgba(45,49,66,0.06)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
        <text x="292" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">클라우드플레어</text>
        <text x="292" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pages · cache</text>

        <!-- Node: Astro (focal accent) -->
        <rect x="416" y="240" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="416" y="240" width="160" height="64" rx="6" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1"/>
        <rect x="424" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(15,118,110,0.50)" stroke-width="0.8"/>
        <text x="440" y="257" fill="#0f766e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ORIG</text>
        <text x="568" y="300" fill="rgba(15,118,110,0.10)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">02</text>
        <text x="496" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">Astro 오리진</text>
        <text x="496" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SSR + MDX</text>

        <!-- Node: MDX Bundle -->
        <rect x="628" y="160" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="628" y="160" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="636" y="168" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="652" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUN</text>
        <text x="700" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">MDX 번들</text>
        <text x="700" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">src/content/*.mdx</text>

        <!-- Node: Content CMS -->
        <rect x="628" y="320" width="144" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="628" y="320" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="636" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="650" y="337" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CMS</text>
        <text x="700" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">콘텐츠 CMS</text>
        <text x="700" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">assets · og images</text>

        <!-- Legend strip -->
        <line x1="40" y1="404" x2="960" y2="404" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="436" width="14" height="10" rx="2" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1"/>
        <text x="60" y="444" fill="#4f5d75" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">포컬 · 오리진</text>

        <rect x="180" y="436" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="200" y="444" fill="#4f5d75" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">백엔드 · 번들</text>

        <rect x="340" y="436" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="360" y="444" fill="#4f5d75" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">저장소</text>

        <rect x="436" y="436" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="456" y="444" fill="#4f5d75" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">클라우드</text>

        <rect x="528" y="436" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="548" y="444" fill="#4f5d75" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">외부</text>

        <line x1="636" y1="442" x2="664" y2="442" stroke="#4c1d95" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="672" y="444" fill="#4f5d75" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">HTTP 요청</text>

        <line x1="784" y1="442" x2="812" y2="442" stroke="#0f766e" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="820" y="444" fill="#4f5d75" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">주요 흐름</text>

        <line x1="900" y1="442" x2="928" y2="442" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="936" y="444" fill="#4f5d75" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">반환 · 비동기</text>
      </svg>
  </div>
</body>
</html>
