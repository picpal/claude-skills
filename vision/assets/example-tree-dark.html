<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code skill taxonomy · Tree</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;
      --color-ink:     #f5f5f5;
      --color-muted:   #bfc0c0;
      --color-accent:  #14b8a6;
      --font-sans:     'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-title:    'Pretendard', 'Noto Sans KR', sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-title);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · vision</p>
    <h1>Claude Code skill taxonomy</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tree-dark-title tree-dark-desc">
      <title id="tree-dark-title">Claude Code skill taxonomy</title>
      <desc id="tree-dark-desc">Tree diagram showing a Skills root branching into Design, Engineering, and Research categories and their leaf skills.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Tier tags (left margin) -->
        <text x="40" y="108" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 0 · ROOT</text>
        <text x="40" y="224" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start">TIER 1</text>
        <text x="40" y="324" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start">TIER 2</text>

        <!-- Connectors drawn first (behind nodes) -->
        <!-- Root → Tier 1 bus -->
        <path d="M 500 132 L 500 168 L 220 168 L 220 200" fill="none" stroke="#bfc0c0" stroke-width="1"/>
        <path d="M 500 168 L 500 200" fill="none" stroke="#bfc0c0" stroke-width="1"/>
        <path d="M 500 168 L 780 168 L 780 200" fill="none" stroke="#bfc0c0" stroke-width="1"/>

        <!-- Design → leaves -->
        <path d="M 220 264 L 220 300 L 140 300 L 140 336" fill="none" stroke="#bfc0c0" stroke-width="1"/>
        <path d="M 220 300 L 320 300 L 320 336" fill="none" stroke="#bfc0c0" stroke-width="1"/>

        <!-- Engineering → leaves -->
        <path d="M 500 264 L 500 336" fill="none" stroke="#bfc0c0" stroke-width="1"/>
        <path d="M 500 300 L 680 300 L 680 336" fill="none" stroke="#bfc0c0" stroke-width="1"/>

        <!-- Research → single leaf -->
        <path d="M 780 264 L 780 300 L 860 300 L 860 336" fill="none" stroke="#bfc0c0" stroke-width="1"/>

        <!-- Root node: Skills (accent focal) -->
        <rect x="420" y="76" width="160" height="56" rx="6" fill="#2d3142"/>
        <rect x="420" y="76" width="160" height="56" rx="6" fill="rgba(20,184,166,0.10)" stroke="#14b8a6" stroke-width="1"/>
        <rect x="428" y="84" width="32" height="12" rx="2" fill="transparent" stroke="rgba(20,184,166,0.50)" stroke-width="0.8"/>
        <text x="444" y="93" fill="#14b8a6" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>
        <text x="500" y="120" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">Skills</text>

        <!-- Tier 1: Design -->
        <rect x="140" y="200" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="140" y="200" width="160" height="64" rx="6" fill="rgba(245,245,245,0.04)" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="148" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
        <text x="162" y="217" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAT</text>
        <text x="220" y="240" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">Design</text>
        <text x="220" y="252" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ui · visual · ux</text>

        <!-- Tier 1: Engineering -->
        <rect x="420" y="200" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="420" y="200" width="160" height="64" rx="6" fill="rgba(245,245,245,0.04)" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="428" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
        <text x="442" y="217" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAT</text>
        <text x="500" y="240" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">Engineering</text>
        <text x="500" y="252" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ship · review · test</text>

        <!-- Tier 1: Research -->
        <rect x="700" y="200" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="700" y="200" width="160" height="64" rx="6" fill="rgba(245,245,245,0.04)" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="708" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
        <text x="722" y="217" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAT</text>
        <text x="780" y="240" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">Research</text>
        <text x="780" y="252" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">investigate · analyze</text>

        <!-- Tier 2: polish -->
        <rect x="60" y="336" width="160" height="48" rx="6" fill="#2d3142"/>
        <rect x="60" y="336" width="160" height="48" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="140" y="360" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">polish</text>
        <text x="140" y="372" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">align · space · rhythm</text>

        <!-- Tier 2: critique -->
        <rect x="240" y="336" width="160" height="48" rx="6" fill="#2d3142"/>
        <rect x="240" y="336" width="160" height="48" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="320" y="360" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">critique</text>
        <text x="320" y="372" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hierarchy · density</text>

        <!-- Tier 2: review -->
        <rect x="420" y="336" width="160" height="48" rx="6" fill="#2d3142"/>
        <rect x="420" y="336" width="160" height="48" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="500" y="360" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">review</text>
        <text x="500" y="372" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pre-land diff · sql</text>

        <!-- Tier 2: ship -->
        <rect x="600" y="336" width="160" height="48" rx="6" fill="#2d3142"/>
        <rect x="600" y="336" width="160" height="48" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="680" y="360" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">ship</text>
        <text x="680" y="372" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">merge · deploy · verify</text>

        <!-- Tier 2: investigate -->
        <rect x="780" y="336" width="160" height="48" rx="6" fill="#2d3142"/>
        <rect x="780" y="336" width="160" height="48" rx="6" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="860" y="360" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">investigate</text>
        <text x="860" y="372" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">root cause · evidence</text>

        <!-- Legend strip -->
        <line x1="40" y1="412" x2="960" y2="412" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="428" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="444" width="14" height="10" rx="2" fill="rgba(20,184,166,0.10)" stroke="#14b8a6" stroke-width="1"/>
        <text x="60" y="452" fill="#bfc0c0" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">Root · focal</text>

        <rect x="180" y="444" width="14" height="10" rx="2" fill="rgba(245,245,245,0.04)" stroke="#f5f5f5" stroke-width="1"/>
        <text x="200" y="452" fill="#bfc0c0" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">Category branch</text>

        <rect x="340" y="444" width="14" height="10" rx="2" fill="rgba(245,245,245,0.05)" stroke="#bfc0c0" stroke-width="0.8"/>
        <text x="360" y="452" fill="#bfc0c0" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">Leaf skill</text>

        <text x="500" y="452" fill="#bfc0c0" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-style="italic">Orthogonal connectors only. Accent marks the root — every branch descends from one idea.</text>
      </svg>
  </div>
</body>
</html>
