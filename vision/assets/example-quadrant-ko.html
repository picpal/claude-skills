<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘텐츠 아이디어 · 임팩트 × 노력</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #0f766e;
      --font-sans:     'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-title:    'Pretendard', 'Noto Sans KR', sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-title);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Quadrant · vision</p>
    <h1>콘텐츠 아이디어 · 임팩트 × 노력</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="quadrant-ko-title quadrant-ko-desc">
      <title id="quadrant-ko-title">콘텐츠 아이디어 · 임팩트 × 노력</title>
      <desc id="quadrant-ko-desc">Impact-effort matrix showing eight content projects across do first, major projects, quick wins, and avoid quadrants.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Quadrant backgrounds (very subtle, only accent on DO FIRST) -->
        <rect x="120" y="80" width="380" height="170" fill="rgba(15,118,110,0.03)"/>

        <!-- Axis cross -->
        <line x1="120" y1="250" x2="880" y2="250" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
        <line x1="500" y1="80" x2="500" y2="420" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>

        <!-- Axis end labels -->
        <text x="880" y="266" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">HIGH EFFORT →</text>
        <text x="120" y="266" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">← LOW EFFORT</text>
        <text x="512" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">↑ HIGH IMPACT</text>
        <text x="512" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">↓ LOW IMPACT</text>

        <!-- Quadrant corner labels -->
        <text x="140" y="104" fill="#0f766e" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em" font-weight="600">DO FIRST</text>
        <text x="860" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.18em">MAJOR PROJECTS</text>
        <text x="140" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em">QUICK WINS</text>
        <text x="860" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.18em">AVOID</text>

        <!-- Items: TL (Do First) -->
        <!-- accent focal -->
        <circle cx="220" cy="140" r="6" fill="#0f766e"/>
        <text x="232" y="144" fill="#2d3142" font-size="11" font-weight="600" font-family="'Pretendard', 'Noto Sans KR', sans-serif">스키매틱 스킬 v4</text>

        <circle cx="320" cy="200" r="4" fill="#2d3142"/>
        <text x="332" y="204" fill="#4f5d75" font-size="11" font-family="'Pretendard', 'Noto Sans KR', sans-serif">체인지로그 갱신</text>

        <!-- Items: TR (Major Projects) -->
        <circle cx="620" cy="140" r="4" fill="#2d3142"/>
        <text x="632" y="144" fill="#4f5d75" font-size="11" font-family="'Pretendard', 'Noto Sans KR', sans-serif">디자인 v4 개편</text>

        <circle cx="760" cy="180" r="4" fill="#2d3142"/>
        <text x="772" y="184" fill="#4f5d75" font-size="11" font-family="'Pretendard', 'Noto Sans KR', sans-serif">새 퍼블리케이션</text>

        <!-- Items: BL (Quick Wins) -->
        <circle cx="260" cy="320" r="4" fill="#2d3142"/>
        <text x="272" y="324" fill="#4f5d75" font-size="11" font-family="'Pretendard', 'Noto Sans KR', sans-serif">푸터 링크 수정</text>

        <circle cx="360" cy="380" r="4" fill="#2d3142"/>
        <text x="372" y="384" fill="#4f5d75" font-size="11" font-family="'Pretendard', 'Noto Sans KR', sans-serif">OG 태그 갱신</text>

        <!-- Items: BR (Avoid) -->
        <circle cx="640" cy="380" r="4" fill="#2d3142"/>
        <text x="652" y="384" fill="#4f5d75" font-size="11" font-family="'Pretendard', 'Noto Sans KR', sans-serif">빌드 파이프라인 재작성</text>

        <circle cx="780" cy="320" r="4" fill="#2d3142"/>
        <text x="792" y="324" fill="#4f5d75" font-size="11" font-family="'Pretendard', 'Noto Sans KR', sans-serif">Nuxt로 이식</text>

        <!-- Legend -->
        <line x1="40" y1="456" x2="960" y2="456" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <circle cx="52" cy="488" r="6" fill="#0f766e"/>
        <text x="68" y="492" fill="#4f5d75" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">내일 착수</text>

        <circle cx="192" cy="488" r="4" fill="#2d3142"/>
        <text x="208" y="492" fill="#4f5d75" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif">후보 프로젝트</text>

        <text x="336" y="492" fill="#4f5d75" font-size="8.5" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-style="italic">위치가 신호입니다. 색은 단 하나의 실행 항목에만 씁니다.</text>
      </svg>
  </div>
</body>
</html>
